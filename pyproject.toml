[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alwl"
version = "0.1.0"
description = "Pool-based deep active learning benchmark for mmWave beam selection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "pyyaml>=6",
  "torch>=2.1",
  "torchvision>=0.16",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/alwl"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
